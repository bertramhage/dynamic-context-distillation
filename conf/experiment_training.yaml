# Training config for hypernetwork distillation.

dataset_cfg: dataset/PEMS-BAY

cross_learning: false
batch_size: null
seed: 42

# --- Training data window ---
training:
  # Training time range (absolute dates)
  train_start_date: "2017-01-01"
  train_end_date: "2017-04-01"    # ~3 months for training
  val_start_date: "2017-04-01"
  val_end_date: "2017-05-01"      # ~1 month for validation

  # Context window sizes (in timesteps at dataset freq)
  long_context_steps: 2016        # 1 week at 5-min freq
  short_context_steps: 288        # 1 day
  prediction_length: 12           # 12 steps = 1 hour at 5-min freq

  # Optional hierarchical length jitter.
  # Batch mean is sampled with sigma_outer, per-sample lengths use sigma_inner.
  length_jitter:
    enabled: false
    apply_in_val: false
    long_sigma_outer: 320.0
    long_sigma_inner: 96.0
    short_sigma_outer: 40.0
    short_sigma_inner: 16.0
    quantize_steps: 24
    long_min_steps: 1008
    long_max_steps: 4032
    short_min_steps: 144
    short_max_steps: 432

  # Multi-query: multiple forecast origins per long context
  n_queries_per_context: 16
  query_stride_steps: 48          # 4 hours between forecast origins

  # Rolling window stride for long context placement
  long_context_stride_steps: 288  # 1 day

  station_holdout:
    enabled: false
    train_fraction: 0.2
    station_split_seed: 42
    stratify_by_mean: true

  # Dataloader
  train_batch_size: 64
  num_workers: 4

# --- Context encoder model ---
# Choices (context_length / d_model):
#   amazon/chronos-bolt-mini   — 2048 / 384
#   amazon/chronos-bolt-small  — 2048 / 512
#   amazon/chronos-bolt-base   — 2048 / 768
#   amazon/chronos-2           — 8192 / 768
# long_context_steps (and jitter long_max_steps) must not exceed context_length.
context_encoder_model: "amazon/chronos-2"
# Early exit for Chronos-2: stop after N encoder layers (null = all 12).
# Ignored for Chronos-Bolt models. Must be in [1, total_layers].
context_encoder_num_layers: 8

# --- Hypernetwork architecture ---
hypernet:
  d_latent: 128                   # Perceiver/head latent dimension
  lora_rank: 8
  n_latent_queries: 32            # Perceiver bottleneck
  num_perceiver_blocks: 1
  n_self_attn_per_block: 1
  n_heads: 8
  num_pre_head_layers: 1
  dropout: 0.1

# --- Training hyperparams ---
optimizer:
  lr: 4.0e-5
  weight_decay: 0.01

training_loop:
  target_mode: teacher           # teacher | ground_truth
  max_epochs: 100
  patience: 10
  lora_scaling: 2.0               # alpha / rank = 16 / 8
  l1_reg_coef: 0.0
  grad_clip: 1.0
  log_every: 10
  checkpoint_dir: checkpoints
  gradient_accumulation_steps: 2
  warmup_steps: 100

teacher_cache:
  enabled: true
  cache_dir: data/teacher_cache
  dtype: float16
  build_batch_size: 32
  jitter_seed: 42               # defaults to global seed when null
  rebuild: false

wandb:
  enabled: false
  entity: null
  run_name: null
  tags: []
